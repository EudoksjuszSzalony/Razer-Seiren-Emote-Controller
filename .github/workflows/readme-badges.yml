name: Update README badges

on:
  workflow_dispatch:
  schedule:
    # The README uses SVG files stored in this repository, not img.shields.io.
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
      - name: Generate dynamic release badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_readme_badges.py
      - name: Commit changed badge SVGs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh README release statistics [skip ci]"
            git push
          fi
