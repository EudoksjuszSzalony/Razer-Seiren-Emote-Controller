name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - '**.py'
      - '**.txt'
      - 'installer/**'
      - 'tools/**'
      - 'build_windows.ps1'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-openrgb.txt
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path '${{ runner.temp }}\inno-ready.txt')) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build app and installer
        shell: pwsh
        run: .\build_windows.ps1
      - name: Check installer output
        shell: pwsh
        run: |
          $file = Get-ChildItem release\SeirenEmoteController_Setup_*.exe | Select-Object -First 1
          if (!$file -or $file.Length -lt 1000000) { throw 'Missing or unexpectedly small installer output' }
          Write-Host "Installer: $($file.Name) ($($file.Length) bytes)"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeirenEmoteController-Setup-Windows-x64
          path: release/SeirenEmoteController_Setup_*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish official release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Download validated Windows installer
        uses: actions/download-artifact@v4
        with:
          name: SeirenEmoteController-Setup-Windows-x64
          path: release
      - name: Publish tagged GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be in major.minor.patch format."
            exit 1
          fi
          TAG="v$VERSION"
          SETUP="release/SeirenEmoteController_Setup_$VERSION.exe"
          test -s "$SETUP" || { echo "::error::Missing installer $SETUP"; exit 1; }
          ALIAS_NAME="SeirenEmoteController_Setup_Latest.exe"
          ALIAS="release/$ALIAS_NAME"
          NOTES="RELEASE_NOTES_$TAG.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping its original installer unchanged."
            # A stable filename on *every* release makes the README's /latest/download
            # URL valid even when future installers have versioned file names.
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ALIAS_NAME"; then
              echo "Stable download asset already exists; nothing to replace."
            else
              mkdir -p existing-release
              gh release download "$TAG" --pattern "$(basename "$SETUP")" --dir existing-release
              cp "existing-release/$(basename "$SETUP")" "$ALIAS"
              test -s "$ALIAS" || { echo "::error::Failed to prepare stable installer alias."; exit 1; }
              gh release upload "$TAG" "$ALIAS"
              echo "Added stable installer alias to release $TAG."
            fi
          else
            # For a new version publish BOTH names, containing the exact same EXE.
            # Never redirect to a filename tied to an older version.
            cp "$SETUP" "$ALIAS"
            if [[ -f "$NOTES" ]]; then
              gh release create "$TAG" "$SETUP" "$ALIAS" --title "Seiren Emote Controller $TAG" --target "$GITHUB_SHA" --notes-file "$NOTES" --latest
            else
              gh release create "$TAG" "$SETUP" "$ALIAS" --title "Seiren Emote Controller $TAG" --target "$GITHUB_SHA" --generate-notes --latest
            fi
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets
