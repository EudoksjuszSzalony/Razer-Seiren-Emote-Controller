name: Windows HID diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hid_diagnostic.py'
      - 'seiren_hid.py'
      - 'seiren_emote_bridge.py'
      - 'emote_importer.py'
      - 'tests/test_hid_diagnostic.py'
      - 'requirements.txt'
      - '.github/workflows/windows-hid-diagnostic.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.11,<7"
      - name: Run diagnostic unit tests
        run: python -m unittest discover -s tests -v
      - name: Build diagnostic console executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name SeirenEmoteHidDiagnostic --add-data 'emote_manifest.json;.' hid_diagnostic.py
          if (!(Test-Path 'dist\SeirenEmoteHidDiagnostic.exe')) { throw 'Diagnostic executable missing' }
      - name: Upload portable diagnostic executable
        uses: actions/upload-artifact@v4
        with:
          name: SeirenEmoteHidDiagnostic-Windows-x64
          path: dist/SeirenEmoteHidDiagnostic.exe
          if-no-files-found: error
          retention-days: 14
